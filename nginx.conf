server {
    listen 80;
    server_name _;
    absolute_redirect off;
    client_max_body_size 2g;
    client_body_timeout 1800s;

    # Canonical trailing-slash URL for relative frontend URLs.
    location = /transcribe {
        return 301 /transcribe/;
    }

    # Strip /transcribe/ before forwarding to FastAPI, which serves at /.
    location ^~ /transcribe/ {
        proxy_pass http://transcribe:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for long-running SSE transcription progress streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Do not expose an ambiguous root URL.
    location = / {
        return 302 /transcribe/;
    }
}
