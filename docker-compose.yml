services:
  transcribe:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
    container_name: mesin-transcribe
    restart: unless-stopped
    init: true
    # Jalankan dengan UID/GID host agar bind mount data dapat ditulis.
    user: "${TRANSCRIBE_UID:-1000}:${TRANSCRIBE_GID:-1000}"
    expose:
      - "8080"
    volumes:
      - ./data/models:/data/models
      - ./data/uploads:/data/uploads
      - ./data/hasil:/data/hasil
      - ./data/config:/data/config
    environment:
      DATA_DIR: /data
      CONFIG_DIR: /data/config
      HF_HOME: /data/models
      PORT: "8080"
      AI_ENABLED: "${AI_ENABLED:-false}"
      TRANSCRIBE_AI_BASE_URL: "${TRANSCRIBE_AI_BASE_URL:-http://10.14.7.237:20130/v1}"
      TRANSCRIBE_AI_MODEL: "${TRANSCRIBE_AI_MODEL:-gemini/gemini-3.7-flash}"
      TRANSCRIBE_AI_API_KEY: "${TRANSCRIBE_AI_API_KEY:-}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-2147483648}"
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
      APP_BASE_PATH: "${APP_BASE_PATH:-/transcribe}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-https://dts-lab.web.id/transcribe/api/auth/callback}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      SESSION_DAYS: "${SESSION_DAYS:-7}"
      AUTH_ALLOWED_DOMAIN: "${AUTH_ALLOWED_DOMAIN:-ugm.ac.id}"
      AUTH_ALLOWED_EMAILS: "${AUTH_ALLOWED_EMAILS:-}"
      AUTH_ADMIN_EMAILS: "${AUTH_ADMIN_EMAILS:-}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
    mem_limit: 4g
    security_opt:
      - no-new-privileges:true
    # /tmp di RAM hanya untuk berkas kecil; unggahan ditampung di ./data/uploads/.tmp
    # (lihat _use_disk_backed_temp_dir) supaya tidak menghabiskan memori container.
    tmpfs:
      - /tmp:size=64m

  transcribe-proxy:
    image: nginx:1.27-alpine
    container_name: mesin-transcribe-proxy
    restart: unless-stopped
    depends_on:
      - transcribe
    ports:
      - "${TRANSCRIBE_HOST_PORT:-8765}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
